body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
.wrap { max-width: 1440px; margin: 0 auto; padding-block: 24px 40px; padding-inline: 16px; display: grid; gap: 12px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: end; justify-content: space-between; }
h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 2px 0 0; }
.nav { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.nav button { font: 600 13px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
.nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.scroller { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; }
svg#g { display: block; width: 100%; min-width: 980px; height: auto; }
svg text { font-family: var(--font-body); fill: var(--ink); }
.stage-rule { stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 7 7; }
.stage-num { font-size: 12px; font-weight: 700; fill: var(--accent); letter-spacing: .08em; }
.stage-name { font-size: 19px; font-weight: 700; }
.n-circle { fill: var(--node); stroke: var(--node-line); stroke-width: 1.5; }
.n-name { font-size: 14px; font-weight: 600; }
.n-sub { font-size: 12px; fill: var(--muted); }
.trigger rect { fill: var(--soft); stroke: var(--accent); stroke-width: 1.5; }
.trigger text { font-size: 13.5px; font-weight: 600; fill: var(--accent); }
.term rect { fill: var(--surface); stroke: var(--ok); stroke-width: 2; }
.term text { font-size: 13.5px; font-weight: 700; fill: var(--ok); }
.dia path { fill: var(--soft); stroke: var(--ink); stroke-width: 1.5; }
.dia text { font-size: 13px; font-weight: 700; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.8; }
.edge.ok { stroke: var(--ok); } .edge.stop { stroke: var(--stop); }
.e-lbl { font-size: 12.5px; fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.e-lbl.ok { fill: var(--ok); font-weight: 600; } .e-lbl.stop { fill: var(--stop); font-weight: 600; }
g.stage { transition: opacity .25s; }
svg.focus g.stage:not(.sel) { opacity: .2; }
.foot { font-size: 12px; color: var(--muted); margin: 0; }
</style>

const MAIL = "data:image/svg+xml;base64," + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2" fill="#0f6cbd"/><path d="m4 7 8 6 8-6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>');

const W = 1400, H = 720;
const STAGES = [
  { x0: 0,    x1: 230,  name: "Open the app" },
  { x0: 230,  x1: 720,  name: "A batch arrives" },
  { x0: 720,  x1: 1100, name: "Agents investigate" },
  { x0: 1100, x1: 1400, name: "A person decides" },
];
// type: res (icon node), trig (start pill), term (end pill), dia (decision)
const N = {
  t1:     { s: 0, type: "trig", x: 115, y: 110, text: "Open the page" },
  app1:   { s: 0, type: "res", x: 115, y: 260, icon: "app", name: "Container App" },

  t2:     { s: 1, type: "trig", x: 340, y: 110, text: "Upload 5 PDFs" },
  blob:   { s: 1, type: "res", x: 340, y: 230, icon: "blob", name: "Blob Storage" },
  grid:   { s: 1, type: "res", x: 340, y: 380, icon: "grid", name: "Event Grid" },
  docint: { s: 1, type: "res", x: 340, y: 540, icon: "docint", name: "Document Intelligence" },
  hono:   { s: 1, type: "res", x: 590, y: 540, icon: "app", name: "Container App" },
  pg:     { s: 1, type: "res", x: 590, y: 660, icon: "pg", name: "PostgreSQL", side: true, sub: ["mapping v1 + invoice history"] },
  d1:     { s: 1, type: "dia", x: 590, y: 380, text: ["Map +", "check"] },
  done1:  { s: 1, type: "term", x: 590, y: 230, text: "Loaded" },

  drift:  { s: 2, type: "res", x: 820, y: 230, icon: "foundry", name: "Drift analyst", sub: ["spots what changed in the layout"] },
  inv:    { s: 2, type: "res", x: 820, y: 380, icon: "foundry", name: "Investigator", sub: ["finds the notice that explains why"] },
  search: { s: 2, type: "res", x: 1010, y: 380, icon: "search", name: "AI Search", sub: ["clinic notices that explain", "a format or price change"] },
  fix:    { s: 2, type: "res", x: 820, y: 540, icon: "foundry", name: "Fix proposer", sub: ["proposes a mapping fix"] },
  d2:     { s: 2, type: "dia", x: 1010, y: 540, text: ["Dry run", "passes?"] },

  logic:  { s: 3, type: "res", x: 1185, y: 540, icon: "logic", name: "Logic App" },
  mail:   { s: 3, type: "res", x: 1185, y: 380, icon: "mail", name: "Email" },
  user:   { s: 3, type: "res", x: 1185, y: 230, icon: "user", name: "Reviewer" },
  app2:   { s: 3, type: "res", x: 1325, y: 380, icon: "app", name: "Container App" },
  pg2:    { s: 3, type: "res", x: 1325, y: 540, icon: "pg", name: "PostgreSQL" },
  done2:  { s: 3, type: "term", x: 1325, y: 660, text: "Loaded" },
};
// [from, to, label, bend (curve amount; sign picks the side), class, stage]
const E = [
  ["t1", "app1", "", .2, "", 0],
  ["app1", "t1", "", .2, "", 0],

  ["t2", "blob", "", 0, "", 1],
  ["blob", "grid", "event", 0, "", 1],
  ["grid", "hono", "webhook", -.1, "", 1],
  ["hono", "docint", "PDFs", .15, "", 1],
  ["docint", "hono", "fields", .15, "", 1],
  ["hono", "pg", "", 0, "", 1],
  ["hono", "d1", "", 0, "", 1],
  ["d1", "done1", "Pass", 0, "ok", 1],

  ["d1", "drift", "Failed", -.08, "stop", 2],
  ["drift", "inv", "", 0, "", 2],
  ["inv", "search", "notices", .2, "", 2],
  ["search", "inv", "", .2, "", 2],
  ["inv", "fix", "", 0, "", 2],
  ["fix", "d2", "", 0, "", 2],
  ["d2", "fix", "No · retry (max 3 rounds)", -.25, "stop", 2, [1000, 610], Math.PI / 2],

  ["d2", "logic", "Yes", 0, "ok", 3],
  ["logic", "mail", "", 0, "", 3],
  ["mail", "user", "", 0, "", 3],
  ["user", "app2", "Approve", -.12, "", 3],
  ["app2", "pg2", "saves mapping v2", 0, "", 3],
  ["pg2", "done2", "", 0, "ok", 3],
];

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("g");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const mk = (tag, attrs, parent = svg, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; };

const defs = mk("defs", {});
for (const [id, c] of [["a", "--line"], ["a-ok", "--ok"], ["a-stop", "--stop"]]) {
  const m = mk("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" }, defs);
  mk("path", { d: "M0,1 L10,5 L0,9 z", style: `fill:var(${c})` }, m);
}

const stageG = STAGES.map((st, i) => {
  if (i) mk("line", { class: "stage-rule", x1: st.x0, x2: st.x0, y1: 16, y2: H - 16 });
  const g = mk("g", { class: "stage" });
  mk("text", { class: "stage-num", x: st.x0 + 22, y: 38 }, g, `STEP ${i + 1}`);
  mk("text", { class: "stage-name", x: st.x0 + 22, y: 62 }, g, st.name);
  return g;
});

// distance from a node's centre to its outline in direction ang
const R_RES = 34;
const pillHalf = (n) => (n.text.length * 8 + 32) / 2;
const rad = (n, ang) => {
  const c = Math.abs(Math.cos(ang)), sn = Math.abs(Math.sin(ang));
  if (n.type === "res") return !n.side && Math.sin(ang) > .5 ? R_RES + 30 + 15 * (n.sub || []).length : R_RES; // leave room for the name under the icon
  if (n.type === "dia") return 1 / (c / 66 + sn / 46);
  return Math.min(pillHalf(n) / Math.max(c, 1e-3), 18 / Math.max(sn, 1e-3));
};

for (const [a, b, label, bend, cls, s, at, fromCorner] of E) {
  const A = N[a], B = N[b], g = stageG[s];
  const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy);
  const nx = -dy / len, ny = dx / len; // left-hand normal of the travel direction
  const cx = (A.x + B.x) / 2 + nx * bend * len, cy = (A.y + B.y) / 2 + ny * bend * len;
  const a0 = Math.atan2(cy - A.y, cx - A.x), a1 = Math.atan2(cy - B.y, cx - B.x);
  const r0 = rad(A, a0) + 2, r1 = rad(B, a1) + 2;
  // diamonds: arrows leave and enter at the nearest corner
  const end = (n, ang, r) => {
    if (n.type !== "dia") return { x: n.x + Math.cos(ang) * r, y: n.y + Math.sin(ang) * r };
    const q = Math.round(ang / (Math.PI / 2)) * (Math.PI / 2), off = Math.abs(Math.cos(q)) > .5 ? 68 : 48;
    return { x: n.x + Math.round(Math.cos(q)) * off, y: n.y + Math.round(Math.sin(q)) * off };
  };
  const p0 = end(A, fromCorner ?? a0, r0), p1 = end(B, a1, r1);
  mk("path", { class: "edge " + cls, d: `M${p0.x},${p0.y} Q${cx},${cy} ${p1.x},${p1.y}`, "marker-end": `url(#${cls ? "a-" + cls : "a"})` }, g);
  if (!label) continue;
  if (at) { mk("text", { class: "e-lbl " + cls, x: at[0], y: at[1], "text-anchor": "middle" }, g, label); continue; }
  // label sits outside the bulge (or left of a straight line), clear of the stroke
  const mx = .25 * p0.x + .5 * cx + .25 * p1.x, my = .25 * p0.y + .5 * cy + .25 * p1.y;
  const sx = bend < 0 ? -nx : nx, sy = bend < 0 ? -ny : ny;
  const horiz = Math.abs(sx) > .5;
  mk("text", {
    class: "e-lbl " + cls,
    x: mx + sx * (horiz ? 10 : 0), y: my + (horiz ? 4 : sy > 0 ? 18 : -8),
    "text-anchor": horiz ? (sx > 0 ? "start" : "end") : "middle",
  }, g, label);
}

for (const n of Object.values(N)) {
  const g = stageG[n.s];
  if (n.type === "res") {
    const r = R_RES, sz = 42;
    mk("circle", { class: "n-circle", cx: n.x, cy: n.y, r }, g);
    mk("image", { href: n.icon === "mail" ? MAIL : ICON[n.icon], x: n.x - sz / 2, y: n.y - sz / 2, width: sz, height: sz }, g);
    if (n.side) {
      mk("text", { class: "n-name", x: n.x + r + 10, y: n.y - 2 }, g, n.name);
      (n.sub || []).forEach((t, i) => mk("text", { class: "n-sub", x: n.x + r + 10, y: n.y + 15 + i * 15 }, g, t));
    } else {
      mk("text", { class: "n-name", x: n.x, y: n.y + r + 20, "text-anchor": "middle" }, g, n.name);
      (n.sub || []).forEach((t, i) => mk("text", { class: "n-sub", x: n.x, y: n.y + r + 37 + i * 15, "text-anchor": "middle" }, g, t));
    }
  } else if (n.type === "dia") {
    const t = mk("g", { class: "dia" }, g);
    mk("path", { d: `M${n.x},${n.y - 46} L${n.x + 66},${n.y} L${n.x},${n.y + 46} L${n.x - 66},${n.y} Z` }, t);
    n.text.forEach((line, i) => mk("text", { x: n.x, y: n.y - 4 + i * 16, "text-anchor": "middle" }, t, line));
  } else {
    const t = mk("g", { class: n.type === "trig" ? "trigger" : "term" }, g), w = n.text.length * 8 + 32;
    mk("rect", { x: n.x - w / 2, y: n.y - 18, width: w, height: 36, rx: 18 }, t);
    mk("text", { x: n.x, y: n.y + 5, "text-anchor": "middle" }, t, n.text);
  }
}

let cur = -1;
function select(i) {
  cur = Math.max(-1, Math.min(STAGES.length - 1, i));
  svg.classList.toggle("focus", cur >= 0);
  stageG.forEach((g, j) => g.classList.toggle("sel", j === cur));
  document.getElementById("pos").textContent = cur < 0 ? "All steps" : `Step ${cur + 1} of ${STAGES.length}`;
}
document.getElementById("prev").addEventListener("click", () => select(cur - 1));
document.getElementById("next").addEventListener("click", () => select(cur + 1));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") { e.preventDefault(); select(cur + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); select(cur - 1); }
  if (e.key === "Escape") select(-1);
});
